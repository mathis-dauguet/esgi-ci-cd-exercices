name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        description: "Select the deployment environment"
        options: [staging, production]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: dist/

  test:
    needs: build
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        node: [20, 22]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: build
          path: dist/
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: application
          path: dist/
      - run: echo "Deploy to ${{ vars.API_URL }}"
      - run: |
          echo "Cible : ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "URL : ${{ vars.API_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "Commit : ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
